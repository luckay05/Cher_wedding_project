# Pings the RSVP database once a day so Supabase's free plan doesn't pause it
# for inactivity. Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL  e.g. https://abcdefghijkl.supabase.co
#   SUPABASE_KEY  the publishable key (same one that's in index.html)
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 22 * * *"   # daily, 22:17 UTC (about 9am Sydney)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call ping()
        run: |
          curl --fail --silent --show-error -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
